name: Windows Release Builder

on:
  push:
    branches:
      - main
    tags:
      - v**
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '*.md'

jobs:
  xaml-lint:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run XAML style check
        run: .\scripts\lint-xaml.ps1

  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-test-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-test-

      - name: Build tests
        run: msbuild Screenbox.Core.Tests\Screenbox.Core.Tests.csproj -p:Configuration=Release -p:Platform=x64 -p:OutDir=C:\BuildOutput\ -restore

      - name: Run tests
        run: C:\BuildOutput\Screenbox.Core.Tests.exe

  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: tag-version
        if: github.ref_type == 'tag'
        run: |
          $found = "${{ github.ref_name }}" -match 'v*(\d+.\d+.\d+)'
          if ($found) { $match = $matches[1] }
          "version=$match" >> $env:GITHUB_OUTPUT

      - name: Update package manifest
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            .\scripts\Update-AppxManifest.ps1
          } else {
            .\scripts\Update-AppxManifest.ps1 -Unsigned
          }

      - name: Update project version
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            .\scripts\Update-ProjectVersion.ps1 -Version "${{ steps.tag-version.outputs.version }}.0"
          } else {
            .\scripts\Update-ProjectVersion.ps1
          }

      - name: Update secrets file
        if: github.ref_type == 'tag'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          .\scripts\Set-Secrets.ps1 -SentryDsn "$env:SENTRY_DSN"

      - name: Build app package
        env:
          PackageDir: C:\DeployOutput\
          SENTRY_ORG: starpine
          SENTRY_PROJECT: screenbox
          SENTRY_URL: https://sentry.io/
          SENTRY_RELEASE: screenbox@${{ steps.tag-version.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $buildMode = "StoreUpload"
            $sentryArgs = "-p:SentryUploadSymbols=true", `
                          "-p:SentryOrg=$env:SENTRY_ORG", `
                          "-p:SentryProject=$env:SENTRY_PROJECT", `
                          "-p:SentryUrl=$env:SENTRY_URL", `
                          "-p:SentryCreateRelease=true", `
                          "-p:SentrySetCommits=true"
          }
          else {
            $buildMode = "SideloadOnly"
            $sentryArgs = @()
          }

          msbuild Screenbox\Screenbox.csproj `
            -restore `
            -p:RestoreConfigFile=nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageDir=$env:PackageDir `
            -p:UapAppxPackageBuildMode=$buildMode `
            @sentryArgs

      - name: Upload Store submission package artifact
        uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          path: C:\DeployOutput\*.msixupload
          archive: false

      - name: Upload sideload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Screenbox-sideload
          path: |
            C:\DeployOutput\*_Test\
            !C:\DeployOutput\*_Test\*.msix
          compression-level: 0

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: Screenbox-sideload
          path: download/

      - name: Zip artifact
        run: zip -r sideload.zip download/

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            sideload.zip
